<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Agrospace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            300: '#86efac', 400: '#4ade80', 500: '#22c55e',
                            600: '#16a34a', 700: '#15803d', 800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-slideIn { animation: slideIn 0.3s ease-out; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        .animate-pulse-scale { animation: pulse-scale 2s infinite; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom scrollbar for chat */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: #a0aec0; }

        /* Message bubble animations */
        .message-bubble {
            animation: fadeIn 0.3s ease-out;
        }

        /* Typing indicator */
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .typing-dot {
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Online status pulse */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .status-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-50 via-white to-green-50 font-sans">

<div class="min-h-screen p-4 md:p-6" x-data="chatApp()">
    
    <!-- Header -->
    <div class="max-w-7xl mx-auto mb-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 flex items-center space-x-3">
                    <span class="bg-primary-500 text-white p-2 rounded-xl">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </span>
                    <span>Messagerie</span>
                </h1>
                <p class="text-gray-500 mt-1">Communiquez avec les producteurs et consommateurs</p>
            </div>
            <button @click="showNewMessageModal = true" 
                    class="bg-primary-500 text-white px-6 py-3 rounded-xl hover:bg-primary-600 transition shadow-lg hover:shadow-xl flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Nouveau message</span>
            </button>
        </div>
    </div>

    <!-- Layout principal -->
    <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Sidebar - Liste des conversations -->
            <div class="lg:col-span-4 xl:col-span-3">
                <div class="bg-white rounded-2xl shadow-xl glass-effect h-[calc(100vh-180px)] flex flex-col">
                    
                    <!-- Search Bar -->
                    <div class="p-4 border-b">
                        <div class="relative">
                            <input type="text" 
                                   x-model="searchQuery"
                                   placeholder="Rechercher une conversation..."
                                   class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
                            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Filtres -->
                    <div class="px-4 py-3 border-b">
                        <div class="flex space-x-2">
                            <button @click="filter = 'all'" 
                                    :class="filter === 'all' ? 'bg-primary-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium transition">
                                Tous
                            </button>
                            <button @click="filter = 'unread'" 
                                    :class="filter === 'unread' ? 'bg-primary-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                                <span>Non lus</span>
                                <span x-show="unreadCount > 0" 
                                      class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full"
                                      x-text="unreadCount"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Liste des conversations -->
                    <div class="flex-1 overflow-y-auto scrollbar-hide">
                        <template x-for="(conversation, index) in filteredConversations" :key="conversation.id">
                            <div @click="selectConversation(conversation)" 
                                 :class="selectedConversation?.id === conversation.id ? 'bg-primary-50 border-l-4 border-primary-500' : 'hover:bg-gray-50'"
                                 class="p-4 border-b cursor-pointer transition animate-slideIn"
                                 :style="'animation-delay: ' + (index * 50) + 'ms'">
                                
                                <div class="flex items-start space-x-3">
                                    <!-- Avatar -->
                                    <div class="relative flex-shrink-0">
                                        <img :src="conversation.avatar" 
                                             :alt="conversation.name"
                                             class="w-12 h-12 rounded-full object-cover ring-2 ring-white">
                                        <!-- Status online -->
                                        <span x-show="conversation.online" 
                                              class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white status-pulse"></span>
                                    </div>

                                    <!-- Info conversation -->
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between mb-1">
                                            <h4 class="font-semibold text-gray-800 truncate" x-text="conversation.name"></h4>
                                            <span class="text-xs text-gray-500" x-text="conversation.time"></span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <p class="text-sm text-gray-600 truncate flex-1" x-text="conversation.lastMessage"></p>
                                            <span x-show="conversation.unread > 0" 
                                                  class="bg-primary-500 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-2 animate-pulse-scale"
                                                  x-text="conversation.unread"></span>
                                        </div>
                                        <!-- Badge rôle -->
                                        <span :class="conversation.role === 'producteur' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'"
                                              class="inline-block mt-1 px-2 py-0.5 text-xs font-medium rounded-full"
                                              x-text="conversation.role === 'producteur' ? '👨‍🌾 Producteur' : '🛒 Consommateur'"></span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- État vide -->
                        <div x-show="filteredConversations.length === 0" class="p-8 text-center">
                            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                            <p class="text-gray-500">Aucune conversation trouvée</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Zone de chat principale -->
            <div class="lg:col-span-8 xl:col-span-9">
                <div class="bg-white rounded-2xl shadow-xl glass-effect h-[calc(100vh-180px)] flex flex-col">
                    
                    <!-- Header du chat -->
                    <div x-show="selectedConversation" class="p-4 border-b flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="relative">
                                <img :src="selectedConversation?.avatar" 
                                     :alt="selectedConversation?.name"
                                     class="w-12 h-12 rounded-full object-cover ring-2 ring-primary-100">
                                <span x-show="selectedConversation?.online" 
                                      class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800" x-text="selectedConversation?.name"></h3>
                                <p class="text-sm text-gray-500">
                                    <span x-show="selectedConversation?.online" class="text-green-600">● En ligne</span>
                                    <span x-show="!selectedConversation?.online" class="text-gray-400">● Hors ligne</span>
                                    <span class="mx-2">•</span>
                                    <span x-text="selectedConversation?.role === 'producteur' ? 'Producteur' : 'Consommateur'"></span>
                                </p>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center space-x-2" x-data="{ showDropdown: false }">
                            <button class="p-2 hover:bg-gray-100 rounded-lg transition">
                                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                </svg>
                            </button>
                            <button class="p-2 hover:bg-gray-100 rounded-lg transition">
                                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                </svg>
                            </button>
                            <div class="relative">
                                <button @click="showDropdown = !showDropdown" class="p-2 hover:bg-gray-100 rounded-lg transition">
                                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                                    </svg>
                                </button>
                                
                                <!-- Dropdown menu -->
                                <div x-show="showDropdown" 
                                     @click.away="showDropdown = false"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 transform scale-95"
                                     x-transition:enter-end="opacity-100 transform scale-100"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 transform scale-100"
                                     x-transition:leave-end="opacity-0 transform scale-95"
                                     class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-200 py-2 z-50">
                                    <a href="#" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
                                        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                        Voir le profil
                                    </a>
                                    <a href="#" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
                                        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                        </svg>
                                        Archiver
                                    </a>
                                    <a href="#" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
                                        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                                        </svg>
                                        Bloquer
                                    </a>
                                    <hr class="my-2">
                                    <a href="#" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition">
                                        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                        </svg>
                                        Supprimer
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Zone des messages -->
                    <div x-show="selectedConversation" 
                         class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll bg-gradient-to-b from-gray-50 to-white"
                         x-ref="messageContainer"
                         @scroll="handleScroll">
                        
                        <!-- Date separator -->
                        <div class="flex items-center justify-center my-6">
                            <div class="bg-white px-4 py-2 rounded-full shadow-sm border text-sm text-gray-600">
                                Aujourd'hui
                            </div>
                        </div>

                        <!-- Messages -->
                        <template x-for="message in messages" :key="message.id">
                            <div :class="message.sent ? 'flex justify-end' : 'flex justify-start'" class="message-bubble">
                                <div :class="message.sent ? 'bg-primary-500 text-white' : 'bg-white text-gray-800 shadow-md'" 
                                     class="max-w-xs lg:max-w-md xl:max-w-lg px-4 py-3 rounded-2xl relative"
                                     :style="message.sent ? 'border-bottom-right-radius: 4px' : 'border-bottom-left-radius: 4px'">
                                    
                                    <!-- Contenu du message -->
                                    <p class="text-sm break-words" x-text="message.text"></p>
                                    
                                    <!-- Pièce jointe (image) -->
                                    <div x-show="message.image" class="mt-2">
                                        <img :src="message.image" 
                                             class="rounded-lg max-w-full cursor-pointer hover:opacity-90 transition"
                                             @click="openImageModal(message.image)">
                                    </div>

                                    <!-- Fichier attaché -->
                                    <div x-show="message.file" 
                                         :class="message.sent ? 'bg-primary-600' : 'bg-gray-100'"
                                         class="mt-2 p-3 rounded-lg flex items-center space-x-3">
                                        <svg class="w-8 h-8" :class="message.sent ? 'text-white' : 'text-primary-500'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                        </svg>
                                        <div class="flex-1">
                                            <p :class="message.sent ? 'text-white' : 'text-gray-800'" class="text-sm font-medium" x-text="message.fileName"></p>
                                            <p :class="message.sent ? 'text-primary-100' : 'text-gray-500'" class="text-xs" x-text="message.fileSize"></p>
                                        </div>
                                        <button class="p-1">
                                            <svg :class="message.sent ? 'text-white' : 'text-primary-500'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                            </svg>
                                        </button>
                                    </div>

                                    <!-- Heure et statut -->
                                    <div :class="message.sent ? 'text-primary-100' : 'text-gray-500'" 
                                         class="text-xs mt-1 flex items-center justify-end space-x-1">
                                        <span x-text="message.time"></span>
                                        <template x-if="message.sent">
                                            <svg x-show="message.read" class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                            </svg>
                                            <svg x-show="!message.read" class="w-4 h-4 text-primary-200" fill="currentColor" viewBox="0 0 20 20">
                                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                            </svg>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Typing indicator -->
                        <div x-show="isTyping" class="flex justify-start">
                            <div class="bg-white px-4 py-3 rounded-2xl shadow-md flex items-center space-x-2">
                                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                            </div>
                        </div>
                    </div>

                    <!-- État vide -->
                    <div x-show="!selectedConversation" class="flex-1 flex items-center justify-center p-8">
                        <div class="text-center">
                            <svg class="w-24 h-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                            <h3 class="text-xl font-bold text-gray-700 mb-2">Sélectionnez une conversation</h3>
                            <p class="text-gray-500 mb-6">Choisissez une conversation dans la liste pour commencer</p>
                            <button @click="showNewMessageModal = true" 
                                    class="bg-primary-500 text-white px-6 py-3 rounded-xl hover:bg-primary-600 transition inline-flex items-center space-x-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                <span>Démarrer une conversation</span>
                            </button>
                        </div>
                    </div>

                    <!-- Input zone -->
                    <div x-show="selectedConversation" class="p-4 border-t bg-gray-50">
                        <div class="flex items-end space-x-3">
                            <!-- Attachments -->
                            <div class="flex space-x-2">
                                <button class="p-2 hover:bg-gray-200 rounded-lg transition" title="Joindre un fichier">
                                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                                    </svg>
                                </button>
                                <button class="p-2 hover:bg-gray-200 rounded-lg transition" title="Joindre une image">
                                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                    </svg>
                                </button>
                            </div>

                            <!-- Message input -->
                            <div class="flex-1 relative">
                                <textarea x-model="newMessage"
                                          @keydown.enter.prevent="sendMessage"
                                          @input="handleTyping"
                                          rows="1"
                                          placeholder="Écrivez votre message..."
                                          class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-none transition"></textarea>
                                
                                <!-- Emoji picker button -->
                                <button class="absolute right-3 top-1/2 transform -translate-y-1/2 p-1 hover:bg-gray-200 rounded transition">
                                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                </button>
                            </div>

                            <!-- Send button -->
                            <button @click="sendMessage" 
                                    :disabled="!newMessage.trim()"
                                    :class="newMessage.trim() ? 'bg-primary-500 hover:bg-primary-600' : 'bg-gray-300 cursor-not-allowed'"
                                    class="p-3 rounded-xl text-white transition shadow-lg">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- Quick replies -->
                        <div class="mt-3 flex flex-wrap gap-2">
                            <button @click="insertQuickReply('Bonjour 👋')" 
                                    class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 hover:bg-gray-50 transition">
                                Bonjour 👋
                            </button>
                            <button @click="insertQuickReply('Merci beaucoup 🙏')" 
                                    class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 hover:bg-gray-50 transition">
                                Merci beaucoup 🙏
                            </button>
                            <button @click="insertQuickReply('C\'est d\'accord ✅')" 
                                    class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 hover:bg-gray-50 transition">
                                C'est d'accord ✅
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nouveau Message -->
    <div x-show="showNewMessageModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
         @click.self="showNewMessageModal = false">
        
        <div x-show="showNewMessageModal"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform scale-90"
             x-transition:enter-end="opacity-100 transform scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform scale-100"
             x-transition:leave-end="opacity-0 transform scale-90"
             class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Nouveau message</h3>
                <button @click="showNewMessageModal = false" class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Recherche utilisateur -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">À</label>
                    <div class="relative">
                        <input type="text" 
                               x-model="userSearch"
                               placeholder="Rechercher un utilisateur..."
                               class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Liste utilisateurs -->
                <div class="max-h-64 overflow-y-auto space-y-2 border border-gray-200 rounded-xl p-2">
                    <template x-for="user in availableUsers" :key="user.id">
                        <button @click="startNewConversation(user)" 
                                class="w-full flex items-center space-x-3 p-3 hover:bg-gray-50 rounded-lg transition text-left">
                            <img :src="user.avatar" :alt="user.name" class="w-10 h-10 rounded-full object-cover">
                            <div class="flex-1">
                                <p class="font-medium text-gray-800" x-text="user.name"></p>
                                <p class="text-sm text-gray-500" x-text="user.role === 'producteur' ? '👨‍🌾 Producteur' : '🛒 Consommateur'"></p>
                            </div>
                            <span :class="user.online ? 'bg-green-500' : 'bg-gray-300'" class="w-3 h-3 rounded-full"></span>
                        </button>
                    </template>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button @click="showNewMessageModal = false" 
                            class="px-6 py-3 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition font-medium">
                        Annuler
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Image Preview -->
    <div x-show="showImageModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-4"
         @click="showImageModal = false">
        
        <div class="relative max-w-4xl w-full">
            <button @click="showImageModal = false" 
                    class="absolute top-4 right-4 p-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg transition">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <img :src="previewImage" class="w-full h-auto rounded-lg shadow-2xl">
        </div>
    </div>

</div>

<script>
function chatApp() {
    return {
        // États
        selectedConversation: null,
        filter: 'all',
        searchQuery: '',
        newMessage: '',
        isTyping: false,
        typingTimeout: null,
        showNewMessageModal: false,
        showImageModal: false,
        previewImage: '',
        userSearch: '',

        // Données
        conversations: [
            {
                id: 1,
                name: 'Marie Fotso',
                avatar: 'https://ui-avatars.com/api/?name=Marie+Fotso&background=22c55e&color=fff',
                role: 'producteur',
                lastMessage: 'J\'ai 100kg de maïs disponibles',
                time: '10:30',
                unread: 2,
                online: true
            },
            {
                id: 2,
                name: 'Paul Ngono',
                avatar: 'https://ui-avatars.com/api/?name=Paul+Ngono&background=3b82f6&color=fff',
                role: 'consommateur',
                lastMessage: 'Pouvez-vous livrer à Douala ?',
                time: '09:15',
                unread: 0,
                online: false
            },
            {
                id: 3,
                name: 'Fatima Hassan',
                avatar: 'https://ui-avatars.com/api/?name=Fatima+Hassan&background=f59e0b&color=fff',
                role: 'producteur',
                lastMessage: 'Merci pour votre commande 🙏',
                time: 'Hier',
                unread: 0,
                online: true
            },
            {
                id: 4,
                name: 'Ibrahim Mahamat',
                avatar: 'https://ui-avatars.com/api/?name=Ibrahim+Mahamat&background=ef4444&color=fff',
                role: 'consommateur',
                lastMessage: 'Je cherche du manioc frais',
                time: 'Hier',
                unread: 1,
                online: false
            },
            {
                id: 5,
                name: 'Sophie Kamga',
                avatar: 'https://ui-avatars.com/api/?name=Sophie+Kamga&background=8b5cf6&color=fff',
                role: 'producteur',
                lastMessage: 'Nouvelles tomates disponibles',
                time: '2j',
                unread: 0,
                online: true
            }
        ],

        messages: [
            {
                id: 1,
                text: 'Bonjour ! Je suis intéressé par vos produits.',
                sent: true,
                time: '10:20',
                read: true
            },
            {
                id: 2,
                text: 'Bonjour ! Merci pour votre intérêt. Que recherchez-vous exactement ?',
                sent: false,
                time: '10:22',
                read: false
            },
            {
                id: 3,
                text: 'J\'ai besoin de maïs bio pour mon exploitation. Quelle quantité avez-vous ?',
                sent: true,
                time: '10:25',
                read: true
            },
            {
                id: 4,
                text: 'J\'ai actuellement 100kg de maïs bio disponible. Le prix est de 500 FCFA/kg.',
                sent: false,
                time: '10:28',
                read: false
            },
            {
                id: 5,
                text: 'Parfait ! Voici une photo de mon champ :',
                sent: true,
                time: '10:29',
                read: true,
                image: 'https://images.unsplash.com/photo-1574943320219-553eb213f72d?w=400'
            },
            {
                id: 6,
                text: 'Excellent ! Quand souhaitez-vous récupérer la marchandise ?',
                sent: false,
                time: '10:30',
                read: false
            }
        ],

        availableUsers: [
            {
                id: 10,
                name: 'Jean Kouam',
                avatar: 'https://ui-avatars.com/api/?name=Jean+Kouam&background=10b981&color=fff',
                role: 'producteur',
                online: true
            },
            {
                id: 11,
                name: 'Aminata Diallo',
                avatar: 'https://ui-avatars.com/api/?name=Aminata+Diallo&background=6366f1&color=fff',
                role: 'consommateur',
                online: false
            },
            {
                id: 12,
                name: 'Thomas Biya',
                avatar: 'https://ui-avatars.com/api/?name=Thomas+Biya&background=ec4899&color=fff',
                role: 'producteur',
                online: true
            }
        ],

        // Computed
        get filteredConversations() {
            let filtered = this.conversations;

            // Filtre par recherche
            if (this.searchQuery) {
                filtered = filtered.filter(c => 
                    c.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    c.lastMessage.toLowerCase().includes(this.searchQuery.toLowerCase())
                );
            }

            // Filtre par type
            if (this.filter === 'unread') {
                filtered = filtered.filter(c => c.unread > 0);
            }

            return filtered;
        },

        get unreadCount() {
            return this.conversations.reduce((sum, c) => sum + c.unread, 0);
        },

        // Méthodes
        selectConversation(conversation) {
            this.selectedConversation = conversation;
            conversation.unread = 0; // Marquer comme lu
            
            // Scroll vers le bas
            this.$nextTick(() => {
                const container = this.$refs.messageContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        },

        sendMessage() {
            if (!this.newMessage.trim()) return;

            const message = {
                id: Date.now(),
                text: this.newMessage,
                sent: true,
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
                read: false
            };

            this.messages.push(message);
            this.newMessage = '';

            // Scroll vers le bas
            this.$nextTick(() => {
                const container = this.$refs.messageContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            });

            // Simuler une réponse après 2 secondes
            this.isTyping = true;
            setTimeout(() => {
                this.isTyping = false;
                this.messages.push({
                    id: Date.now(),
                    text: 'Merci pour votre message ! Je vous réponds bientôt.',
                    sent: false,
                    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
                    read: false
                });
                
                this.$nextTick(() => {
                    const container = this.$refs.messageContainer;
                    if (container) {
                        container.scrollTop = container.scrollHeight;
                    }
                });
            }, 2000);
        },

        handleTyping() {
            // Simuler l'indicateur "en train d'écrire"
            clearTimeout(this.typingTimeout);
            
            // Émettre événement typing (pour Livewire/WebSocket)
            // wire:emit('typing', selectedConversation.id)
            
            this.typingTimeout = setTimeout(() => {
                // Émettre événement stop typing
                // wire:emit('stopTyping', selectedConversation.id)
            }, 1000);
        },

        insertQuickReply(text) {
            this.newMessage = text;
            this.sendMessage();
        },

        startNewConversation(user) {
            // Vérifier si conversation existe déjà
            let existingConv = this.conversations.find(c => c.name === user.name);
            
            if (existingConv) {
                this.selectConversation(existingConv);
            } else {
                // Créer nouvelle conversation
                const newConv = {
                    id: Date.now(),
                    name: user.name,
                    avatar: user.avatar,
                    role: user.role,
                    lastMessage: 'Nouvelle conversation',
                    time: 'Maintenant',
                    unread: 0,
                    online: user.online
                };
                
                this.conversations.unshift(newConv);
                this.selectConversation(newConv);
                this.messages = []; // Vider les messages
            }
            
            this.showNewMessageModal = false;
            this.userSearch = '';
        },

        openImageModal(image) {
            this.previewImage = image;
            this.showImageModal = true;
        },

        handleScroll() {
            // Détecter le scroll pour charger plus de messages (pagination)
            const container = this.$refs.messageContainer;
            if (container && container.scrollTop === 0) {
                // Charger plus de messages
                // wire:call('loadMoreMessages')
            }
        }
    }
}
</script>

</body>
</html>
